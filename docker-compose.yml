services:
  # ── Apache Solr ────────────────────────────────────────────────────────────
  solr:
    build:
      context: .
      dockerfile: Dockerfile.solr
    container_name: solr_search
    ports:
      - "8983:8983"
    environment:
      - SOLR_JAVA_MEM=-Xms512m -Xmx1g
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:8983/solr/documents/admin/ping || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ── Data Loader (runs once, then exits) ───────────────────────────────────
  solr-init:
    build:
      context: .
      dockerfile: Dockerfile.init
    container_name: solr_init
    depends_on:
      solr:
        condition: service_healthy
    restart: "no"
