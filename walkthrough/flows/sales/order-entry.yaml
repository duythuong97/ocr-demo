# yaml-language-server: $schema=../../flow.schema.json
# 受注登録〜出荷指示フロー（サンプル）
# このファイルは flow.schema.json に従います。書き方は CONTRIBUTING.md を参照。
id: sales-order-entry
title: 受注登録〜出荷指示
system: 販売管理システム (SLS)
category: 営業 / 受注
summary: >-
  得意先から受けた注文を販売管理システムに登録し、与信チェックと必要に応じた
  課長承認を経て、物流へ出荷指示を出すまでの一連の操作。
roles:
  - 営業担当
  - 営業課長
  - 物流担当
preconditions:
  - 得意先マスタに対象得意先が登録済みであること
  - 営業担当に「受注入力」権限が付与されていること
tags: [受注, 与信, 承認, 出荷]
owner: 営業システム課
updated: 2026-10-02
version: 1
references:
  - title: 販売管理システム 操作マニュアル v3.2
    location: 第4章 受注管理 p.45-58
  - title: 与信管理規程
    location: 第7条 与信限度額超過時の承認

steps:
  - id: login
    title: システムにログインする
    actor: 営業担当
    screen: SLS-0001 ログイン画面
    actions:
      - ユーザーID（社員番号8桁）とパスワードを入力する
      - 「ログイン」ボタンを押下する
    expected: メインメニューが表示される
    errors:
      - code: E0001
        message: ユーザーIDまたはパスワードが正しくありません
        fix: 5回失敗するとロックされる。ロック時は情報システム部へ解除依頼。

  - id: open-order
    title: 受注入力画面を開く
    actor: 営業担当
    screen: SLS-0100 メインメニュー
    actions:
      - メニュー「受注管理」→「受注入力」を選択する
    expected: 受注入力画面（SLS-0210）が新規モードで開く

  - id: customer
    title: 得意先と納品条件を入力する
    actor: 営業担当
    screen: SLS-0210 受注入力（ヘッダ）
    actions:
      - 得意先コード欄で F4 を押し、得意先検索ダイアログから選択する
      - 受注日・希望納期・納品先を入力する
    inputs:
      - field: 得意先コード
        example: C102938
        required: true
        note: 7桁。取引停止先は選択不可
      - field: 受注日
        example: 2026/10/02
        required: true
        note: 初期値はシステム日付
      - field: 希望納期
        example: 2026/10/09
        required: true
        note: 受注日から2営業日以降
      - field: 納品先
        example: 本社倉庫
        required: false
        note: 未入力時は得意先マスタの既定納品先
    expected: 得意先名・締日・支払条件が自動表示される
    errors:
      - code: E1023
        message: 得意先が取引停止状態です
        fix: 営業管理課に取引再開申請を出す。このフローはここで中断。

  - id: lines
    title: 受注明細を入力する
    actor: 営業担当
    screen: SLS-0211 受注入力（明細）
    actions:
      - 「明細追加」を押下し、商品コードと数量を入力する
      - 単価は得意先別単価が自動設定される。変更する場合は理由を選択する
      - 全明細を入力したら「与信チェック」ボタンを押下する
    inputs:
      - field: 商品コード
        example: P-40021
        required: true
      - field: 数量
        example: "120"
        required: true
        note: 入数単位で入力（ケース単位ではない）
      - field: 単価
        example: "1,850"
        required: true
        note: 手入力で変更した場合は「単価変更理由」が必須
    expected: 合計金額と与信残高が画面下部に表示される
    tips:
      - 明細が50行を超える場合は「CSV取込」を使うと早い

  - id: credit-check
    type: decision
    title: 与信チェックの結果は？
    actor: システム
    screen: SLS-0211 受注入力（明細）
    description: 受注金額 + 売掛残高 が得意先の与信限度額を超えるかを自動判定する。
    branches:
      - label: 与信限度内
        next: confirm
      - label: 与信限度超過
        next: request-approval

  - id: request-approval
    title: 与信超過の承認を申請する
    actor: 営業担当
    screen: SLS-0215 与信超過承認申請
    actions:
      - 「承認申請」ボタンを押下する
      - 申請理由と入金予定日を入力し「申請」を押下する
    inputs:
      - field: 申請理由
        example: 年末商戦向け増量。11月末に前回分入金予定
        required: true
      - field: 入金予定日
        example: 2026/11/30
        required: true
    expected: 受注ステータスが「承認待ち」になり、営業課長へ通知メールが送られる

  - id: approval
    type: decision
    title: 営業課長が承認するか？
    actor: 営業課長
    screen: SLS-0900 承認ワークフロー
    description: 課長は承認一覧から申請を開き、与信状況と申請理由を確認して判断する。
    branches:
      - label: 承認
        next: confirm
      - label: 差戻し
        next: lines
        note: 差戻しコメントを確認し、数量や納期を調整して再チェックする

  - id: confirm
    title: 受注を確定する
    actor: 営業担当
    screen: SLS-0211 受注入力（明細）
    actions:
      - 内容を確認し「登録」ボタンを押下する
      - 確認ダイアログで「はい」を押下する
    expected: 受注番号（例 SO-2026-0012345）が採番され、ステータスが「受注確定」になる
    tips:
      - 受注番号は得意先への受注確認メールに記載する

  - id: shipping
    title: 出荷指示を出す
    actor: 物流担当
    screen: LGS-0300 出荷指示一覧
    actions:
      - 「出荷指示一覧」で出荷予定日を指定して検索する
      - 対象の受注番号にチェックを入れ「出荷指示」を押下する
    expected: ピッキングリストが倉庫プリンタに出力される
    end: true
